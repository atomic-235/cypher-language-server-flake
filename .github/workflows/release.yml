name: Release

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and publish even if the pinned version matches"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31

      # The package's `latest` dist-tag is stale (0.0.0-canary-2025…); the
      # release line we want is published under `next`.
      - name: Resolve latest `next` version
        id: latest
        run: |
          version="$(curl -fsSL 'https://registry.npmjs.org/@neo4j-cypher%2Flanguage-server/next' | jq -r .version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Compare with pinned version
        id: check
        run: |
          current="$(jq -r .version version.json)"
          echo "pinned=${current}" >> "$GITHUB_OUTPUT"
          if [ "$current" = "${{ steps.latest.outputs.version }}" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update version, lock and hash
        id: hashes
        if: steps.check.outputs.new == 'true'
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          meta="$(curl -fsSL "https://registry.npmjs.org/@neo4j-cypher/language-server/${VERSION}")"
          integrity="$(printf '%s' "$meta" | jq -r .dist.integrity)"
          tarball="$(printf '%s' "$meta" | jq -r .dist.tarball)"

          tmp="$(mktemp -d)"
          curl -fsSL "$tarball" | tar xz -C "$tmp"
          ( cd "$tmp/package" && npm install --package-lock-only --ignore-scripts >/dev/null )
          cp "$tmp/package/package-lock.json" package-lock.json

          npm_deps_hash="$(nix run nixpkgs#prefetch-npm-deps -- package-lock.json | tail -1)"

          jq -n --arg v "$VERSION" --arg i "$integrity" --arg h "$npm_deps_hash" \
            '{version: $v, integrity: $i, npmDepsHash: $h, assets: {}}' > version.json

          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Build self-contained bundle
        id: build
        if: steps.hashes.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          nix bundle --bundler github:NixOS/bundlers#toArx '.#unbundled' -o "$RUNNER_TEMP/cypher-arx"
          cp -L "$RUNNER_TEMP/cypher-arx" cypher-language-server-linux-x86_64
          bin_sha="$(nix hash file --type sha256 --sri cypher-language-server-linux-x86_64)"

          jq --arg s "$bin_sha" '.assets["x86_64-linux"] = $s' version.json > version.json.tmp
          mv version.json.tmp version.json
          echo "bundle=true" >> "$GITHUB_OUTPUT"

      - name: Publish release asset
        if: steps.build.outputs.bundle == 'true'
        env:
          VERSION: ${{ steps.latest.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" --title "cypher-language-server ${VERSION}" \
              --notes "Self-contained cypher-language-server ${VERSION} bundle (node + node_modules + dist)."
          fi
          gh release upload "v${VERSION}" cypher-language-server-linux-x86_64 --clobber

      # The published bundle must satisfy the flake's fixed-output check before
      # the commit points consumers at it.
      - name: Verify the flake can consume the bundle
        if: steps.build.outputs.bundle == 'true'
        run: nix build --no-link .#default

      - name: Commit and tag
        if: steps.build.outputs.bundle == 'true'
        env:
          VERSION: ${{ steps.latest.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add version.json package-lock.json flake.lock
          if ! git diff --cached --quiet; then
            git commit -m "release: cypher-language-server ${VERSION}"
            git push origin HEAD:main
          fi
          git tag -f "v${VERSION}"
          git tag -f latest
          git push --force origin "v${VERSION}" latest

      - name: Open issue when the build fails
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          gh issue create \
            --title "cypher-language-server ${VERSION}: release build failed" \
            --body "The release build for cypher-language-server ${VERSION} failed. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
